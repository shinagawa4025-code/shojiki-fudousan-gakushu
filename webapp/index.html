    // 公開版であとから読み込む詳細の束(data-lazy 付き)は js/appData.js が再試行と案内をするので、ここでは数えない
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT' && !t.hasAttribute('data-lazy')) (window.__bootFailed = window.__bootFailed || []).push(t.src);
    }, true);
  </script>
  <script>
    // 描画前にテーマを確定してちらつきを防ぐ(theme.js と同じ判定。古いブラウザでも動くよう ES5 で書く)
    (function () {
      var theme = 'light';
      try {
        var pref = JSON.parse(localStorage.getItem('shojikiLearn.v1.themePreference'));
        if (pref === 'light' || pref === 'dark') theme = pref;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
