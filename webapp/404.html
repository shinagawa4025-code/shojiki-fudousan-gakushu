<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; background: #f4f6f9; color: #1a2330; display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; text-align: center; line-height: 1.7; }
    main { max-width: 32em; }
    h1 { font-size: 1.375rem; margin: 16px 0 8px; }
    p { margin: 0; color: #5a6577; }

      body { background: #0f141b; color: #e6ebf1; }
