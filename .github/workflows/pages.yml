name: Deploy to GitHub Pages

# master に push すると、確認 → 単体テスト → ビルド(まとめて縮小)→ ブラウザでの動作確認 → ブラウザのテスト → 公開 の順に動く。
# - 確認(tools/check.js)が失敗したら何も公開しない(今の公開版がそのまま残る)
# - ビルドか動作確認が失敗したら、元のファイル(webapp)をそのまま公開する(キャッシュ名だけコミットごとに変える)。
#   元のファイルでも動作確認が失敗するとき(元のファイル自体の不具合)は、何も公開しない
# - どちらの経路でも、サイトのフォルダを作ったあと・動作確認の前に、検索エンジン向けの静的ページ(learn/ と sitemap.xml)を
#   tools/static_pages.js で作る。データは元のファイル(webapp)から読む。生成に失敗すると予備の経路でも同じく失敗するので、
#   何も公開しない(静的ページのないサイトを黙って公開しない)。動作確認(--require-static)は静的ページがあることも確かめる
# - 予備の経路でもブラウザでの動作確認は必須(--require-browser)。ランナーに Chrome が見つからないときは、確かめていない
#   元のファイルを公開せずに失敗する(今の公開版が残り、実行は失敗として通知される)
# - 自動テスト(tools/test.js)は2か所で動かす。どちらも失敗したら何も公開しない(今の公開版が残る)。予備の経路には切り替えない
#   ・単体テスト(--unit): 確認のすぐあと、元のファイル(webapp)で。数秒
#   ・ブラウザのテスト(--browser): ビルドの経路か予備の経路でサイトのフォルダ(_site)ができたあと、公開する直前に、
#     そのフォルダ(これから公開するもの)で。ランナーに Chrome がなければ失敗(--require-browser)
#   予備の経路(元のファイルの公開)はこれまでどおりビルド・静的ページ・動作確認(smoke)の失敗のときだけ。テストの失敗は予備の経路に回さない
#   (テストが見つけるのは画面の動きの不具合で、元のファイルにも同じ不具合があるため。公開を止めて直す)
# - 各段階に時間の上限を付ける(ビルドの経路が想定外に長引いても、予備の経路が job の上限の前に動けるように)
# 依存パッケージは使わない(npm install なし。Node の標準機能と、ランナーに入っている Chrome だけ。テストも同じ)
# ランナーは ubuntu-24.04 に固定(ubuntu-latest は 2026-10-19 から Ubuntu 26.04 へ順次切り替わる。移るときは
# ubuntu-26.04 で一度動かして、smoke.js が Chrome を見つけること・ビルドの BUILD_ID が変わらないことを確かめてから)
# actions はすべて Node 24 で動く版(Node 20 の版は廃止予定の警告が出る)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。実行中の公開は止めない(途中で止めると公開が中途半端になりうる)。待っている古い実行は新しい実行に置き換わる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # 確認3 + 単体テスト3 + ビルド8 + 予備8 + ブラウザのテスト10 分の上限より長く(ふだんは合わせて6分ほど)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Check content and raw sources
        timeout-minutes: 3
        run: node tools/check.js webapp
      # 失敗したら何も公開しない(continue-on-error なし)
      - name: Unit tests (raw sources)
        timeout-minutes: 3
        run: node tools/test.js --unit --raw webapp
      - name: Build bundles, static pages and smoke test
        id: bundle
        continue-on-error: true
        timeout-minutes: 8
        run: |
          node tools/build.js webapp _site
          node tools/static_pages.js _site --webapp webapp
          node tools/smoke.js _site --raw webapp --require-browser --require-static
      - name: Fallback - deploy raw sources with a unique cache name
        if: steps.bundle.outcome != 'success'
        timeout-minutes: 8
        run: |
          rm -rf _site
          cp -r webapp _site
          SHA="${GITHUB_SHA::10}"
          sed -i -E '/^const CACHE_NAME = /s/shojiki-gakushu-[0-9A-Za-z._-]+/shojiki-gakushu-raw-'"$SHA"'/' _site/sw.js
          grep -q "shojiki-gakushu-raw-$SHA" _site/sw.js
          # 静的ページが作れなければ(ここで失敗すると)何も公開しない(今の公開版が残る)
          node tools/static_pages.js _site --webapp webapp
          # 元のファイルでも動かなければ(元のファイル自体の不具合・ブラウザがない)、何も公開しない(今の公開版が残る)
          node tools/smoke.js _site --raw webapp --require-browser --require-static
          echo "::warning::Bundle build, static pages or smoke test failed; falling back to the raw sources (CACHE_NAME shojiki-gakushu-raw-$SHA). They are deployed only if the browser tests pass"
      # これから公開する _site(ビルドの経路でも予備の経路でも)をブラウザで確かめる。失敗したら何も公開しない
      # (continue-on-error なし・予備の経路には回さない)。--raw は単体テストと同じ元のファイル
      - name: Browser tests (the site to be deployed)
        timeout-minutes: 10
        run: node tools/test.js --browser --site _site --raw webapp --require-browser
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
